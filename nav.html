---
layout: default
title: 工具箱
permalink: /nav/
body_class: layout-nav
---

<div class="toolbox" id="toolbox">
    <header class="toolbox-head">
        <div class="toolbox-head-copy">
            <div class="toolbox-eyebrow">TOOLBOX / 我的导航</div>
            <h1>AI 工具箱</h1>
            <p>267 个精选站点，按功能归类：AI 对话、编程、模型平台、多模态生成、智能体、开发、设计、社区与效率工具。搜索或点分类快速定位。</p>
        </div>
        <div class="toolbox-search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="toolbox-search" placeholder="搜索工具 / 站点名称…" autocomplete="off" spellcheck="false">
            <button class="search-clear" id="toolbox-search-clear" type="button" aria-label="清除搜索" hidden>×</button>
        </div>
    </header>

    <div class="toolbox-body">
        <aside class="toolbox-sidebar" aria-label="分类导航">
            <button class="toolbox-cat is-active" data-cat="all" type="button">
                <span class="cat-name">全部</span>
                <span class="cat-count" id="count-all">0</span>
            </button>
            {% for c in site.data.nav.categories %}
            <button class="toolbox-cat" data-cat="{{ c.slug }}" type="button">
                <span class="cat-name">{{ c.name }}</span>
                <span class="cat-count">{{ c.count }}</span>
            </button>
            {% endfor %}
        </aside>

        <div class="toolbox-content">
            <div class="toolbox-meta" id="toolbox-meta">共 267 个站点</div>
            <div class="toolbox-grid" id="toolbox-grid"></div>
            <div class="toolbox-empty" id="toolbox-empty" hidden>
                <p>没有匹配「<span id="toolbox-empty-query"></span>」的结果</p>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';
    var DATA = {{ site.data.nav | jsonify }};
    var grid = document.getElementById('toolbox-grid');
    var meta = document.getElementById('toolbox-meta');
    var empty = document.getElementById('toolbox-empty');
    var emptyQuery = document.getElementById('toolbox-empty-query');
    var search = document.getElementById('toolbox-search');
    var clearBtn = document.getElementById('toolbox-search-clear');
    var countAll = document.getElementById('count-all');
    var cats = Array.prototype.slice.call(document.querySelectorAll('.toolbox-cat'));

    var currentCat = 'all';
    var currentQuery = '';

    countAll.textContent = DATA.items.length;

    function hostOf(url) {
        try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
    }

    function letterFor(name) {
        var s = name.trim();
        return s ? s.charAt(0).toUpperCase() : '?';
    }

    function render() {
        var q = currentQuery.trim().toLowerCase();
        var items = DATA.items.filter(function (it) {
            if (currentCat !== 'all' && it.category !== currentCat) return false;
            if (!q) return true;
            var name = (it.name || '').toLowerCase();
            var url = (it.url || '').toLowerCase();
            return name.indexOf(q) !== -1 || url.indexOf(q) !== -1;
        });

        var catName = '全部';
        if (currentCat !== 'all') {
            var c = DATA.categories.filter(function (x) { return x.slug === currentCat; })[0];
            if (c) catName = c.name;
        }
        meta.textContent = (q ? '「' + currentQuery + '」的搜索结果 · ' : '') + catName + ' · ' + items.length + ' 个站点';

        empty.hidden = items.length !== 0;
        if (items.length === 0) { emptyQuery.textContent = currentQuery; grid.innerHTML = ''; return; }

        var html = items.map(function (it) {
            var letter = letterFor(it.name);
            var icon = it.favicon
                ? '<span class="t-favicon-wrap"><img class="t-favicon" src="' + it.favicon + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=\'' + letter + '\'; this.parentNode.classList.add(\'is-fallback\');"></span>'
                : '<span class="t-favicon-wrap is-fallback">' + letter + '</span>';
            return '<a class="t-item" href="' + it.url + '" target="_blank" rel="noopener noreferrer">' +
                '<span class="t-icon">' + icon + '</span>' +
                '<span class="t-body">' +
                    '<span class="t-name">' + it.name + '</span>' +
                    '<span class="t-host">' + hostOf(it.url) + '</span>' +
                '</span>' +
                '<span class="t-arrow" aria-hidden="true">↗</span>' +
            '</a>';
        }).join('');
        grid.innerHTML = html;
    }

    cats.forEach(function (btn) {
        btn.addEventListener('click', function () {
            cats.forEach(function (b) { b.classList.remove('is-active'); });
            btn.classList.add('is-active');
            currentCat = btn.getAttribute('data-cat');
            render();
        });
    });

    search.addEventListener('input', function () {
        currentQuery = search.value;
        clearBtn.hidden = !currentQuery;
        render();
    });

    clearBtn.addEventListener('click', function () {
        search.value = '';
        currentQuery = '';
        clearBtn.hidden = true;
        search.focus();
        render();
    });

    render();
})();
</script>
