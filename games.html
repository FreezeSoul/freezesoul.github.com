---
layout: default
title: 游戏库
permalink: /games/
body_class: layout-games
---

{% assign games_total = site.data.games.items | size %}

<div class="games">
    <header class="games-head">
        <div class="eyebrow">GAMES / 游戏导航</div>
        <h1>游戏库</h1>
        <p>{{ games_total }} 个站点，按模拟器生态、资源下载、在线开玩、资料库与社区分区。资源下载区为外部资源站，请自行甄别。</p>
    </header>

    <div class="games-toolbar">
        <div class="games-chips" id="games-chips">
            <button class="games-chip is-active" data-cat="all" type="button">全部<b>{{ games_total }}</b></button>
            {% for c in site.data.games.categories %}
            <button class="games-chip" data-cat="{{ c.slug }}" type="button">{{ c.name }}<b>{{ c.count }}</b></button>
            {% endfor %}
        </div>
        <div class="games-search">
            <input type="search" id="games-search" placeholder="搜索游戏站 / 工具名称…" autocomplete="off" spellcheck="false">
            <button class="games-clear" id="games-search-clear" type="button" aria-label="清除搜索" hidden>×</button>
        </div>
    </div>

    <div class="games-meta" id="games-meta"></div>
    <div class="games-grid" id="games-grid"></div>
    <div class="games-empty" id="games-empty" hidden>
        <p>没有匹配「<span id="games-empty-query"></span>」的结果</p>
    </div>
</div>

<script>
(function () {
    'use strict';
    var DATA = {{ site.data.games | jsonify }};
    /* 分类计数由条目实时重算，避免静态计数漂移 */
    DATA.categories.forEach(function (c) {
        c.count = DATA.items.filter(function (i) { return i.category === c.slug; }).length;
    });
    var grid = document.getElementById('games-grid');
    var meta = document.getElementById('games-meta');
    var empty = document.getElementById('games-empty');
    var emptyQuery = document.getElementById('games-empty-query');
    var search = document.getElementById('games-search');
    var clearBtn = document.getElementById('games-search-clear');
    var chips = Array.prototype.slice.call(document.querySelectorAll('.games-chip'));

    var CATCOLOR = { emu: 'var(--accent)', res: 'var(--warning)', online: 'var(--success)', db: 'var(--muted)', community: 'var(--danger)' };
    var currentCat = 'all';
    var currentQuery = '';

    function hostOf(url) {
        try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
    }
    function letterFor(name) {
        var s = (name || '').trim();
        return s ? s.charAt(0).toUpperCase() : '?';
    }

    function render() {
        var q = currentQuery.trim().toLowerCase();
        var items = DATA.items.filter(function (it) {
            if (currentCat !== 'all' && it.category !== currentCat) return false;
            if (!q) return true;
            return ((it.name || '') + ' ' + (it.url || '')).toLowerCase().indexOf(q) !== -1;
        });

        var catName = '全部分区';
        if (currentCat !== 'all') {
            var c = DATA.categories.filter(function (x) { return x.slug === currentCat; })[0];
            if (c) catName = c.name;
        }
        meta.textContent = catName + ' · ' + items.length + ' 个站点' + (q ? ' · 搜索「' + currentQuery + '」' : '');

        empty.hidden = items.length !== 0;
        if (items.length === 0) { emptyQuery.textContent = currentQuery; grid.innerHTML = ''; return; }

        grid.innerHTML = items.map(function (it) {
            var letter = letterFor(it.name);
            var icon = it.favicon
                ? '<span class="g-favicon"><img src="' + it.favicon + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=\'' + letter + '\'; this.parentNode.classList.add(\'is-fallback\');"></span>'
                : '<span class="g-favicon is-fallback">' + letter + '</span>';
            return '<a class="g-tile" style="--gc:' + (CATCOLOR[it.category] || 'var(--accent)') + '" href="' + it.url + '" target="_blank" rel="noopener noreferrer">' +
                '<span class="g-top">' + icon +
                    '<span class="g-name">' + it.name + '</span>' +
                '</span>' +
                '<span class="g-host">' + hostOf(it.url) + '</span>' +
            '</a>';
        }).join('');
    }

    chips.forEach(function (btn) {
        btn.addEventListener('click', function () {
            chips.forEach(function (b) { b.classList.remove('is-active'); });
            btn.classList.add('is-active');
            currentCat = btn.getAttribute('data-cat');
            render();
        });
    });

    search.addEventListener('input', function () {
        currentQuery = search.value;
        clearBtn.hidden = !currentQuery;
        render();
    });

    clearBtn.addEventListener('click', function () {
        search.value = '';
        currentQuery = '';
        clearBtn.hidden = true;
        search.focus();
        render();
    });

    render();
})();
</script>
