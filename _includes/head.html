<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.meta_description }}{% endif %}">
    <meta name="author" content="{{ site.author_name }}">

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
      /* ?embed=1：技能库被外站嵌入时隐藏站点页头页脚，须在绘制前判定 */
      if (/[?&]embed=1(?:&|$)/.test(location.search)) document.documentElement.classList.add('embed');
    </script>

    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | prepend: site.baseurl | prepend: site.url }}">
    <link rel="stylesheet" href="{{ '/css/main.css' | prepend: site.baseurl }}">

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" defer></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (typeof mermaid === 'undefined') return;
        /* Diagrams render on a fixed light "paper" plate. Most posts carry
           inline `style ... fill:#e1f5ff` colours authored for light
           backgrounds, so a light theme keeps those semantic colours intact
           in both site themes instead of fighting them. */
        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          themeVariables: {
            background: '#fbfcfe',
            primaryColor: '#eef2f8',
            primaryTextColor: '#1f2937',
            primaryBorderColor: '#96a3ba',
            lineColor: '#5c6b86',
            secondaryColor: '#eef4fb',
            tertiaryColor: '#f7f9fc',
            edgeLabelBackground: '#fbfcfe',
            clusterBkg: '#f3f6fb',
            clusterBorder: '#c2ccdb',
            nodeTextColor: '#1f2937',
            textColor: '#33405a',
            titleColor: '#1f2937',
            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'
          },
          securityLevel: 'loose'
        });

        document.querySelectorAll('code.language-mermaid').forEach(function (block) {
          var pre = block.parentElement;
          pre.removeAttribute('class');
          pre.classList.add('mermaid');
          pre.textContent = block.textContent;
        });

        mermaid.init(undefined, document.querySelectorAll('.mermaid'));
      });
    </script>

    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:url" content="{{ page.url | prepend: site.baseurl | prepend: site.url }}">
    <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.meta_description }}{% endif %}">
    <meta property="og:image" content="{{ site.author_image | prepend: site.baseurl | prepend: site.url }}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.meta_description }}{% endif %}">
    <meta name="twitter:image" content="{{ site.author_image | prepend: site.baseurl | prepend: site.url }}">

    {% include schema.html %}
</head>
