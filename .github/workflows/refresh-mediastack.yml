name: Refresh MediaStack data

on:
  schedule:
    # 每周一 03:23 UTC（北京时间 11:23 左右）
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch real repo stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/refresh-mediastack.js
          node tools/refresh-opensource.js

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- _data/mediastack.json _data/opensource.json; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/mediastack.json _data/opensource.json
            git commit -m "chore: 刷新技能库与开源推荐仓库数据（定时任务）"
            git push
          fi
