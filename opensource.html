---
layout: default
title: 开源推荐
permalink: /opensource/
body_class: layout-opensource
---

{% assign os_total = site.data.opensource.items | size %}

<div class="opensource">
    <header class="games-head">
        <div class="eyebrow">OPEN SOURCE / 开源推荐</div>
        <h1>开源推荐</h1>
        <p>{{ os_total }} 个值得收藏的开源仓库，带一句人话简介；星数为每周自动刷新的真实数据。</p>
    </header>

    <div class="games-toolbar">
        <div class="games-chips" id="os-chips">
            <button class="games-chip is-active" data-cat="all" type="button">全部<b>{{ os_total }}</b></button>
            {% for c in site.data.opensource.categories %}
            <button class="games-chip" data-cat="{{ c.slug }}" type="button">{{ c.name }}<b>{{ c.count }}</b></button>
            {% endfor %}
        </div>
        <div class="games-search">
            <input type="search" id="os-search" placeholder="搜索仓库 / 关键词…" autocomplete="off" spellcheck="false">
            <button class="games-clear" id="os-search-clear" type="button" aria-label="清除搜索" hidden>×</button>
        </div>
    </div>

    <div class="os-sections" id="os-sections"></div>
    <div class="games-empty" id="os-empty" hidden>
        <p>没有匹配「<span id="os-empty-query"></span>」的结果</p>
    </div>
</div>

<script>
(function () {
    'use strict';
    var DATA = {{ site.data.opensource | jsonify }};
    var sections = document.getElementById('os-sections');
    var empty = document.getElementById('os-empty');
    var emptyQuery = document.getElementById('os-empty-query');
    var search = document.getElementById('os-search');
    var clearBtn = document.getElementById('os-search-clear');
    var chips = Array.prototype.slice.call(document.querySelectorAll('#os-chips .games-chip'));

    var currentCat = 'all';
    var currentQuery = '';

    function letterFor(name) {
        var s = (name || '').trim();
        return s ? s.charAt(0).toUpperCase() : '?';
    }
    function esc(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function render() {
        var q = currentQuery.trim().toLowerCase();
        var groups = DATA.categories.filter(function (c) {
            return currentCat === 'all' || c.slug === currentCat;
        });

        var html = '';
        var total = 0;
        var num = 0;
        groups.forEach(function (c, gi) {
            var items = DATA.items.filter(function (it) {
                if (it.category !== c.slug) return false;
                if (!q) return true;
                return ((it.name || '') + ' ' + (it.repo || '') + ' ' + (it.d || '')).toLowerCase().indexOf(q) !== -1;
            });
            if (items.length === 0) return;
            total += items.length;
            html += '<section class="os-group">' +
                '<header class="os-group-head">' +
                    '<span class="os-group-idx">' + ('0' + (gi + 1)).slice(-2) + '</span>' +
                    '<h2>' + esc(c.name) + '</h2>' +
                    '<span class="os-group-count">' + items.length + ' 个项目</span>' +
                '</header>';
            items.forEach(function (it) {
                num += 1;
                var owner = it.repo ? it.repo.split('/')[0] : '';
                var letter = letterFor(it.name);
                var avatar = it.repo
                    ? '<img src="https://github.com/' + esc(owner) + '.png?size=64" alt="" loading="lazy" onerror="this.parentNode.innerHTML=\'' + letter + '\'; this.parentNode.classList.add(\'is-fallback\');">'
                    : '';
                var star = it.starStr
                    ? '<span class="os-star"><b>' + esc(it.starStr) + '</b><i>' + esc(it.pushed || '') + '</i></span>'
                    : '<span class="os-star"><i>site</i></span>';
                html += '<a class="os-row" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' +
                    '<span class="os-num">' + ('00' + num).slice(-3) + '</span>' +
                    '<span class="os-avatar' + (it.repo ? '' : ' is-fallback') + '">' + avatar + (it.repo ? '' : letter) + '</span>' +
                    '<span class="os-main">' +
                        '<span class="os-name">' + esc(it.name) + (it.repo ? '<span class="os-repo">' + esc(it.repo) + '</span>' : '') + '</span>' +
                        '<span class="os-desc">' + esc(it.d) + '</span>' +
                    '</span>' +
                    star +
                '</a>';
            });
            html += '</section>';
        });

        sections.innerHTML = html;
        empty.hidden = total !== 0;
        if (total === 0) emptyQuery.textContent = currentQuery;
    }

    chips.forEach(function (btn) {
        btn.addEventListener('click', function () {
            chips.forEach(function (b) { b.classList.remove('is-active'); });
            btn.classList.add('is-active');
            currentCat = btn.getAttribute('data-cat');
            render();
        });
    });

    search.addEventListener('input', function () {
        currentQuery = search.value;
        clearBtn.hidden = !currentQuery;
        render();
    });

    clearBtn.addEventListener('click', function () {
        search.value = '';
        currentQuery = '';
        clearBtn.hidden = true;
        search.focus();
        render();
    });

    render();
})();
</script>
