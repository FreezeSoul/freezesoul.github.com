<!DOCTYPE html>
<html lang="zh-CN">
    {% include head.html %}
    <body class="layout-{{ page.layout }} {{ page.body_class }}">
        <div class="site-shell">
            {% include header.html %}
            <main class="site-main" id="main">{{ content }}</main>
            {% include footer.html %}
        </div>
        <script src="{{ '/js/theme.js' | prepend: site.baseurl }}?v={{ asset_v }}" defer></script>
        {% if page.layout == 'post' %}<script src="{{ '/js/article.js' | prepend: site.baseurl }}?v={{ asset_v }}" defer></script>{% endif %}
    </body>
</html>
